name: Validate Nossa Rotina

on:
  push:
    branches: [main]
    paths:
      - "nossa-rotina/**"
      - ".github/workflows/deploy-nossa-rotina-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "nossa-rotina/**"
      - ".github/workflows/deploy-nossa-rotina-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nossa-rotina-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_URL: https://ytuzerdwjffqgzltjnoo.supabase.co/functions/v1/nossa-rotina/

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate application files
        run: |
          test -f nossa-rotina/index.html
          test -f nossa-rotina/styles.css
          test -f nossa-rotina/app.js
          test -f nossa-rotina/manifest.webmanifest
          node --check nossa-rotina/app.js
          node -e "JSON.parse(require('fs').readFileSync('nossa-rotina/manifest.webmanifest','utf8'))"
          grep -q './styles.css' nossa-rotina/index.html
          grep -q './app.js' nossa-rotina/index.html
      - name: Check public application
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 "${PUBLIC_URL}?health=1" --output /tmp/health.json
          node -e "const value=JSON.parse(require('fs').readFileSync('/tmp/health.json','utf8')); if(value.ok!==true) process.exit(1)"

          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 "$PUBLIC_URL" --output /tmp/nossa-rotina-index.html
          test -s /tmp/nossa-rotina-index.html
          grep -q '<title>Nossa Rotina' /tmp/nossa-rotina-index.html
          grep -q 'id="boot"' /tmp/nossa-rotina-index.html

          curl --fail --silent --show-error --location --retry 3 "${PUBLIC_URL}app.js" --output /tmp/nossa-rotina-app.js
          test -s /tmp/nossa-rotina-app.js
          node --check /tmp/nossa-rotina-app.js
          grep -q 'routine_create_household' /tmp/nossa-rotina-app.js

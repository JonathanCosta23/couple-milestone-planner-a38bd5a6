<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nossa Rotina</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#64748b;--line:#e2e8f0;--j:#2563eb;--i:#db2777;--p:#7c3aed;--ok:#15803d;--shadow:0 14px 36px rgba(15,23,42,.09)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#e8edff,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{max-width:1180px;margin:auto;padding:20px 16px 100px}.top{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.topin{max-width:1180px;margin:auto;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:11px;align-items:center}.logo{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--j),var(--i));font-weight:900}.brand h1{margin:0;font-size:18px}.brand small{color:var(--muted)}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 13px;font-weight:800}.btn.primary{border:0;background:linear-gradient(135deg,var(--p),#9f67ff);color:#fff}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.nav button{padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-weight:900;color:var(--muted)}.nav button.active{color:var(--p);border-color:var(--p);background:#f2edff}.grid{display:grid;gap:16px}.two{grid-template-columns:1.2fr .8fr}.metrics{grid-template-columns:repeat(3,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}h2{font-size:clamp(30px,5vw,43px);margin:6px 0}.sub{color:var(--muted);line-height:1.5}.metric b{display:block;font-size:28px;margin-top:8px}.metric span{color:var(--muted);font-size:12px}.daybar{display:flex;gap:7px;overflow:auto;margin:18px 0}.daybar button{min-width:76px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card);font-weight:850}.daybar button.active{background:var(--p);color:#fff}.timeline{display:flex;flex-direction:column;gap:9px}.item{display:grid;grid-template-columns:70px 34px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:15px;padding:11px}.time{font-size:12px;font-weight:900;color:var(--p)}.check{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#f8fafc}.check.done{background:var(--ok);color:#fff}.meta{font-size:11px;color:var(--muted);margin-top:3px}.pill{font-size:10px;font-weight:900;padding:5px 8px;border-radius:999px;background:#f2edff;color:var(--p)}.workmode{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.workmode button{border:1px solid var(--line);border-radius:13px;padding:10px;background:var(--card);font-weight:800}.workmode button.active{border-color:var(--p);color:var(--p);background:#f2edff}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{font-size:11px;color:var(--muted);font-weight:800}.field input,.field select{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:11px}.editor{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}.auth{max-width:520px;margin:60px auto}.auth .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.week{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.weekday{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:14px}.lanes{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lane{border:1px solid var(--line);border-radius:14px;padding:10px}.lane.j h4{color:var(--j)}.lane.i h4{color:var(--i)}.mini{padding:7px 0;border-bottom:1px solid var(--line);font-size:11px}.toast{position:fixed;right:16px;top:80px;background:var(--card);padding:11px 13px;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:850px){.two,.week{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}.workmode{grid-template-columns:1fr 1fr}}@media(max-width:560px){.shell{padding:16px 11px 80px}.nav{position:fixed;left:8px;right:8px;bottom:8px;z-index:30;margin:0;background:rgba(245,247,251,.92);padding:7px;border-radius:16px}.nav button{font-size:11px;padding:10px 4px}.form,.lanes{grid-template-columns:1fr}.item{grid-template-columns:58px 32px 1fr}.item .pill{grid-column:3;justify-self:start}}</style></head><body><header class="top"><div class="topin"><div class="brand"><div class="logo">J&I</div><div><h1>Nossa Rotina</h1><small>Jonathan e Isabella</small></div></div><button id="logout" class="btn hidden">Sair</button></div></header><main class="shell"><section id="auth" class="auth card"><h2>Entrar</h2><p class="sub">Cada um usa o próprio login e compartilha o mesmo cronograma.</p><div class="tabs"><button class="btn primary" data-auth="login">Entrar</button><button class="btn" data-auth="signup">Criar conta</button></div><div class="form"><label class="field">E-mail<input id="email" type="email"></label><label class="field">Senha<input id="password" type="password"></label></div><button id="authSubmit" class="btn primary" style="width:100%;margin-top:12px">Entrar</button><p id="authMsg" class="sub"></p></section><section id="setup" class="auth card hidden"><h2>Conectar rotina</h2><p class="sub">Crie o espaço ou entre usando o código enviado pela outra pessoa.</p><div class="form"><label class="field">Seu nome<input id="displayName" value="Jonathan"></label><label class="field">Perfil<select id="personKey"><option value="jonathan">Jonathan</option><option value="isabella">Isabella</option></select></label></div><div class="form" style="margin-top:10px"><label class="field">Nome do espaço<input id="householdName" value="Nossa Rotina"></label><label class="field">Código de convite<input id="inviteCode" placeholder="Ex.: A1B2C3D4"></label></div><div class="editor"><button id="createHousehold" class="btn primary">Criar espaço</button><button id="joinHousehold" class="btn">Entrar com código</button></div></section><section id="app" class="hidden"><nav class="nav"><button data-tab="jonathan" class="active">Jonathan</button><button data-tab="isabella">Isabella</button><button data-tab="schedule">Nosso cronograma</button></nav><div id="view"></div></section></main><div id="toast" class="toast"></div><script>const SUPABASE_URL='https://ytuzerdwjffqgzltjnoo.supabase.co';const SUPABASE_KEY='sb_publishable_efnBKhPIePJ8dR-uEHfF7w_x25RIjJO';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const days=['segunda','terça','quarta','quinta','sexta','sábado','domingo'];const labels={segunda:'Seg',terça:'Ter',quarta:'Qua',quinta:'Qui',sexta:'Sex',sábado:'Sáb',domingo:'Dom'};let mode='login',tab='jonathan',day=days[(new Date().getDay()+6)%7],household=null,state=null,channel=null;const $=id=>document.getElementById(id);const base={settings:{bedtime:'00:40',homeStart:'09:00',officeWake:'07:00',officeLeave:'07:30',officeArrival:'08:50',englishStart:'18:00',gymStart:'19:30'},workModes:{segunda:'home',terça:'office',quarta:'office',quinta:'home',sexta:'home',sábado:'off',domingo:'off'},done:{},tasks:{}};const templates={jonathan:{home:[['08:50','Acordar e iniciar trabalho','Home office'],['12:30','Almoço + Duolingo','10–15 min'],['17:15','Refeição pré-treino','Já preparada'],['19:30','Treino','2h a 2h30'],['22:00','Banho + jantar','Jantar pronto'],['00:40','Dormir','Horário habitual']],office:[['07:00','Acordar','Dia presencial'],['07:30','Sair de casa','Chegada 08:40–09:00'],['12:30','Almoço + Duolingo','10–15 min'],['18:00','Compromisso da noite','Inglês, treino ou descanso'],['22:00','Banho + jantar','Refeição pronta'],['00:40','Dormir','Horário habitual']],off:[['09:30','Acordar + café','Sem pressa'],['11:00','Treino ou preparo','Flexível'],['14:30','Salesforce ou lazer','Conforme o dia'],['18:00','Planejamento ou descanso','Flexível']]},isabella:{home:[['09:00','Curso ou capacitação','1h30'],['10:45','Buscar vagas','3 a 5 candidaturas'],['14:00','LinkedIn e networking','1 contato'],['15:30','Portfólio ou currículo','1 bloco'],['17:15','Refeição pré-treino','Porção maior'],['19:30','Treino','Com Jonathan'],['22:00','Banho + jantar','Refeição reforçada']],office:[['09:00','Curso ou capacitação','1h30'],['10:45','Buscar vagas','3 a 5 candidaturas'],['14:00','LinkedIn e networking','1 contato'],['15:30','Portfólio ou currículo','1 bloco'],['18:00','Inglês ou rotina pessoal','Conforme o dia'],['20:15','Jantar','Rotina leve']],off:[['09:30','Acordar + café','Sem pressa'],['11:00','Treino ou preparo','Flexível'],['14:30','Organização pessoal','Curso, vagas ou lazer'],['18:00','Planejamento ou descanso','Flexível']]}};function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}function currentTasks(p,d){if(state.tasks?.[p]?.[d])return state.tasks[p][d];return templates[p][state.workModes[d]||'off']}async function persist(){const {error}=await sb.from('routine_state').update({data:state}).eq('household_id',household.id);if(error)toast(error.message);else toast('Salvo e sincronizado')}function daybar(){return `<div class="daybar">${days.map(d=>`<button data-day="${d}" class="${d===day?'active':''}">${labels[d]}</button>`).join('')}</div>`}function personView(p){const list=currentTasks(p,day);const done=list.filter((_,i)=>state.done[`${p}-${day}-${i}`]).length;return `<p style="color:${p==='jonathan'?'var(--j)':'var(--i)'};font-weight:900;text-transform:uppercase;font-size:12px">Rotina de ${p==='jonathan'?'Jonathan':'Isabella'}</p><h2>${day[0].toUpperCase()+day.slice(1)}</h2><p class="sub">Tudo pode ser ajustado. O modo de trabalho muda a estrutura do dia.</p>${daybar()}<div class="grid metrics"><section class="card metric"><span>Progresso</span><b>${Math.round(done/list.length*100)}%</b></section><section class="card metric"><span>Modo do dia</span><b>${state.workModes[day]==='home'?'Home':state.workModes[day]==='office'?'Presencial':'Folga'}</b></section><section class="card metric"><span>Blocos</span><b>${list.length}</b></section></div><div class="grid two" style="margin-top:16px"><section class="card"><h3>Meu dia</h3><div class="timeline" style="margin-top:12px">${list.map((x,i)=>`<article class="item"><div class="time">${x[0]}</div><button class="check ${state.done[`${p}-${day}-${i}`]?'done':''}" data-check="${p}-${day}-${i}">${state.done[`${p}-${day}-${i}`]?'✓':''}</button><div><div><b>${x[1]}</b></div><div class="meta">${x[2]}</div></div><span class="pill">${state.done[`${p}-${day}-${i}`]?'Feito':'Planejado'}</span></article>`).join('')}</div><div class="editor"><button class="btn" data-edit="${p}">Editar tarefas</button></div></section><section class="card"><h3>Modo de trabalho</h3><p class="sub">Escolha como será este dia.</p><div class="workmode">${[['home','Home'],['office','Presencial'],['off','Folga'],['custom','Personalizado']].map(x=>`<button data-mode="${x[0]}" class="${state.workModes[day]===x[0]?'active':''}">${x[1]}</button>`).join('')}</div><div class="form" style="margin-top:14px"><label class="field">Dormir<input data-setting="bedtime" type="time" value="${state.settings.bedtime}"></label><label class="field">Academia<input data-setting="gymStart" type="time" value="${state.settings.gymStart}"></label><label class="field">Acordar presencial<input data-setting="officeWake" type="time" value="${state.settings.officeWake}"></label><label class="field">Sair de casa<input data-setting="officeLeave" type="time" value="${state.settings.officeLeave}"></label></div></section></div>`}function schedule(){return `<h2>Nosso cronograma</h2><p class="sub">Jonathan e Isabella lado a lado. Altere cada dia em qualquer perfil.</p><div class="week">${days.map(d=>`<section class="weekday"><h3>${d[0].toUpperCase()+d.slice(1)} · ${state.workModes[d]==='home'?'Home':state.workModes[d]==='office'?'Presencial':'Folga'}</h3><div class="lanes"><div class="lane j"><h4>Jonathan</h4>${currentTasks('jonathan',d).map(x=>`<div class="mini"><b>${x[0]} · ${x[1]}</b><div class="meta">${x[2]}</div></div>`).join('')}</div><div class="lane i"><h4>Isabella</h4>${currentTasks('isabella',d).map(x=>`<div class="mini"><b>${x[0]} · ${x[1]}</b><div class="meta">${x[2]}</div></div>`).join('')}</div></div></section>`).join('')}</div>`}function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('view').innerHTML=tab==='schedule'?schedule():personView(tab);bind()}function bind(){document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=b.dataset.day;render()});document.querySelectorAll('[data-check]').forEach(b=>b.onclick=async()=>{state.done[b.dataset.check]=!state.done[b.dataset.check];render();await persist()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=async()=>{state.workModes[day]=b.dataset.mode;render();await persist()});document.querySelectorAll('[data-setting]').forEach(i=>i.onchange=async()=>{state.settings[i.dataset.setting]=i.value;await persist()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editTasks(b.dataset.edit))}function editTasks(p){const list=currentTasks(p,day);const text=prompt('Edite as tarefas. Use uma linha por tarefa no formato HORÁRIO | TÍTULO | DETALHE',list.map(x=>x.join(' | ')).join('\n'));if(text===null)return;state.tasks[p]??={};state.tasks[p][day]=text.split('\n').filter(Boolean).map(l=>{const a=l.split('|').map(x=>x.trim());return[a[0]||'00:00',a[1]||'Tarefa',a[2]||'']});persist().then(render)}async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return;$('auth').classList.add('hidden');$('logout').classList.remove('hidden');const {data:members}=await sb.from('routine_members').select('household_id,person_key,display_name').eq('user_id',session.user.id);if(!members?.length){$('setup').classList.remove('hidden');return}household={id:members[0].household_id};const {data:r}=await sb.from('routine_state').select('data').eq('household_id',household.id).single();state=Object.keys(r?.data||{}).length?r.data:structuredClone(base);$('app').classList.remove('hidden');render();channel=sb.channel('routine-'+household.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'routine_state',filter:'household_id=eq.'+household.id},p=>{state=p.new.data;render();toast('Atualizado pelo outro usuário')}).subscribe()}document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>{mode=b.dataset.auth;$('authSubmit').textContent=mode==='login'?'Entrar':'Criar conta'});$('authSubmit').onclick=async()=>{const email=$('email').value,password=$('password').value;const r=mode==='login'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});$('authMsg').textContent=r.error?.message||'Conta processada';if(!r.error)location.reload()};$('createHousehold').onclick=async()=>{const {data,error}=await sb.rpc('routine_create_household',{p_name:$('householdName').value,p_person_key:$('personKey').value,p_display_name:$('displayName').value});if(error)return toast(error.message);alert('Código de convite: '+data[0].invite_code);location.reload()};$('joinHousehold').onclick=async()=>{const {error}=await sb.rpc('routine_join_household',{p_invite_code:$('inviteCode').value,p_person_key:$('personKey').value,p_display_name:$('displayName').value});if(error)return toast(error.message);location.reload()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});boot();</script></body></html>

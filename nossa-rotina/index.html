<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="Rotina compartilhada de Jonathan e Isabella." />
  <title>Nossa Rotina — Jonathan & Isabella</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div id="boot" class="boot-screen">
    <div class="boot-logo">J&I</div>
    <p>Carregando nossa rotina…</p>
  </div>

  <header id="appHeader" class="app-header hidden">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark">J&I</div>
        <div>
          <strong>Nossa Rotina</strong>
          <small id="householdLabel">Jonathan e Isabella</small>
        </div>
      </div>
      <div class="header-actions">
        <span id="syncStatus" class="sync-status"><i></i> Sincronizado</span>
        <button id="settingsButton" class="icon-button" type="button" aria-label="Abrir ajustes">⚙</button>
        <button id="logoutButton" class="icon-button" type="button" aria-label="Sair">↪</button>
      </div>
    </div>
    <nav id="mainNav" class="main-nav" aria-label="Navegação principal"></nav>
  </header>

  <main class="page-shell">
    <section id="authView" class="auth-layout hidden"></section>
    <section id="setupView" class="auth-layout hidden"></section>
    <section id="appView" class="hidden"></section>
  </main>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>

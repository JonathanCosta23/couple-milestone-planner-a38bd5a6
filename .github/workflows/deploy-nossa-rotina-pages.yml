name: Validate Nossa Rotina

on:
  push:
    branches: [main]
    paths:
      - "nossa-rotina/**"
      - ".github/workflows/deploy-nossa-rotina-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "nossa-rotina/**"
      - ".github/workflows/deploy-nossa-rotina-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nossa-rotina-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_URL: https://ytuzerdwjffqgzltjnoo.supabase.co/functions/v1/nossa-rotina/

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate application files
        run: |
          test -f nossa-rotina/index.html
          test -f nossa-rotina/styles.css
          test -f nossa-rotina/app.js
          test -f nossa-rotina/manifest.webmanifest
          node --check nossa-rotina/app.js
          node -e "JSON.parse(require('fs').readFileSync('nossa-rotina/manifest.webmanifest','utf8'))"
          grep -q './styles.css' nossa-rotina/index.html
          grep -q './app.js' nossa-rotina/index.html
      - name: Check public application
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 "${PUBLIC_URL}?health=1" | grep -q '"ok":true'
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 "$PUBLIC_URL" | grep -q 'Nossa Rotina'
          curl --fail --silent --show-error --location --retry 3 "${PUBLIC_URL}app.js" | grep -q 'routine_create_household'

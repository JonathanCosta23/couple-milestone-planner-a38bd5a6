name: Validate Nossa Rotina

on:
  push:
    branches: [main]
    paths:
      - "nossa-rotina/**"
      - "supabase/functions/nossa-rotina/**"
      - ".github/workflows/deploy-nossa-rotina-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "nossa-rotina/**"
      - "supabase/functions/nossa-rotina/**"
      - ".github/workflows/deploy-nossa-rotina-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nossa-rotina-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_URL: https://ytuzerdwjffqgzltjnoo.supabase.co/functions/v1/nossa-rotina/

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate source files
        run: |
          test -f nossa-rotina/index.html
          test -f nossa-rotina/styles.css
          test -f nossa-rotina/app.js
          test -f nossa-rotina/manifest.webmanifest
          test -f supabase/functions/nossa-rotina/index.ts
          node --check nossa-rotina/app.js
          node -e "JSON.parse(require('fs').readFileSync('nossa-rotina/manifest.webmanifest','utf8'))"

      - name: Check public application
        run: |
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 "${PUBLIC_URL}?health=1" --output /tmp/health.json
          node -e "const value=JSON.parse(require('fs').readFileSync('/tmp/health.json','utf8')); if(value.ok!==true || value.version<3 || value.delivery!=='single-html') process.exit(1)"

          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 "$PUBLIC_URL" --output /tmp/nossa-rotina.html
          test -s /tmp/nossa-rotina.html
          test "$(wc -c < /tmp/nossa-rotina.html)" -gt 100000
          grep -q '<title>Nossa Rotina' /tmp/nossa-rotina.html
          grep -q 'name="nossa-rotina-build" content="edge-inline-v3"' /tmp/nossa-rotina.html
          grep -q 'routine_create_household' /tmp/nossa-rotina.html
          grep -q 'id="authView"' /tmp/nossa-rotina.html
          ! grep -q 'src="./app.js"' /tmp/nossa-rotina.html
          ! grep -q 'href="./styles.css"' /tmp/nossa-rotina.html
